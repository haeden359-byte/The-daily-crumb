<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Daily Crumb</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:16px}
    header{display:flex;align-items:center;justify-content:space-between}
    .products{display:flex;gap:12px;margin:12px 0}
    .product{border:1px solid #ddd;padding:12px;border-radius:6px;width:160px}
    #cart{border:1px dashed #bbb;padding:12px;margin-top:12px}
    .hidden{display:none}
    #payment-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
    #payment-modal .panel{background:#fff;padding:16px;border-radius:8px;min-width:280px}
    table{border-collapse:collapse;width:100%}
    th,td{padding:6px;border:1px solid #eee;text-align:left}
  </style>
</head>
<body>
  <header>
    <h1 id="store-title-display">BREAD STORE</h1>
    <div id="clock">--:--:--</div>
  </header>

  <section>
    <h2>Products</h2>
    <div class="products">
      <div class="product">
        <div><strong>Sourdough</strong></div>
        <div id="price-sourdough">8.00</div>
        <button onclick="addToCart('Sourdough','price-sourdough')">Add to Cart</button>
      </div>
      <div class="product">
        <div><strong>Baguette</strong></div>
        <div id="price-baguette">9.50</div>
        <button onclick="addToCart('Baguette','price-baguette')">Add to Cart</button>
      </div>
      <div class="product">
        <div><strong>Plain Roll</strong></div>
        <div id="price-plain">6.00</div>
        <button onclick="addToCart('Plain Roll','price-plain')">Add to Cart</button>
      </div>
    </div>
  </section>

  <section id="cart">
    <h2>Cart</h2>
    <div id="cart-empty-message">Your cart is empty</div>
    <div id="cart-form-content" class="hidden">
      <div id="tray-summary"></div>
      <form id="order-form">
        <div>
          <label>Pickup Date: <select id="pickup-date"></select></label>
        </div>
        <div><label>Name: <input id="cust-name" required></label></div>
        <div><label>Phone: <input id="cust-phone"></label></div>
        <div><label>Email: <input id="cust-email" type="email"></label></div>
        <div id="capacity-status"></div>
        <div style="margin-top:8px"><button type="submit">Place Order</button></div>
      </form>
    </div>
  </section>

  <section style="margin-top:18px">
    <h2>Manifest (Admin)</h2>
    <div>
      <label>Show orders for: <input type="date" id="manifest-date-select"></label>
      <button id="render-manifest-btn">Show</button>
    </div>
    <div id="manifest-table-wrapper" style="margin-top:12px"></div>
  </section>

  <div id="payment-modal">
    <div class="panel">
      <h3>Payment</h3>
      <div>Total: <span id="modal-total-display">$0.00</span></div>
      <div style="margin-top:8px"><a id="cashapp-link" href="#" target="_blank">Pay with CashApp</a></div>
      <div style="margin-top:12px"><button onclick="closeModal()">Close</button></div>
    </div>
  </div>

  <script>
    // Simple, robust implementation that fixes broken JS in the original file.
    let currentCart = null;
    const maxCapacityPerDay = 10;

    // Utilities
    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"'\/]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#47;'})[c] || c;
    }); }

    function formatMoney(n){ return '$' + Number(n||0).toFixed(2); }

    // Live clock
    function startLiveClock(){ setInterval(()=>{
      const now=new Date(); document.getElementById('clock').textContent = now.toLocaleTimeString();
    },1000); }

    // Populate pickup date select (next 14 days, skip none by default)
    function recalculateRollingCalendar(){
      const select = document.getElementById('pickup-date');
      select.innerHTML = '';
      const today = new Date();
      for(let i=0;i<14;i++){
        const d = new Date(); d.setDate(today.getDate() + i);
        const opt = document.createElement('option');
        opt.value = d.toISOString().slice(0,10);
        opt.textContent = d.toLocaleDateString();
        select.appendChild(opt);
      }
      checkCapacityAlert();
    }

    function getOrderCountForDate(dateStr){
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      if(!dateStr) return 0;
      return orders.filter(o=>o.date === dateStr).length;
    }

    function checkCapacityAlert(){
      const selectEl = document.getElementById('pickup-date');
      if(!selectEl) return;
      const selected = selectEl.value;
      const statusNotice = document.getElementById('capacity-status');
      const submitBtn = document.querySelector('#order-form button[type="submit"]');
      const used = getOrderCountForDate(selected);
      const remaining = Math.max(0, maxCapacityPerDay - used);
      if(remaining <= 0){
        if(statusNotice) statusNotice.innerHTML = `<span style="color:red;">Sorry, this pickup slot is full.</span>`;
        if(submitBtn) submitBtn.disabled = true;
      } else {
        if(statusNotice) statusNotice.innerHTML = `<span style="color:green;">Slots Available: ${remaining} / ${maxCapacityPerDay}</span>`;
        if(submitBtn) submitBtn.disabled = false;
      }
    }

    function addToCart(itemName, priceElementId){
      const priceEl = document.getElementById(priceElementId);
      if(!priceEl) return;
      const price = parseFloat(priceEl.innerText) || 0;
      currentCart = { name: itemName, price };
      document.getElementById('cart-empty-message').style.display = 'none';
      document.getElementById('cart-form-content').classList.remove('hidden');
      document.getElementById('tray-summary').textContent = `${itemName} — ${formatMoney(price)}`;
      checkCapacityAlert();
    }

    function processOrder(e){
      e.preventDefault();
      if(!currentCart){ alert('No item in cart'); return; }
      const selectedDate = document.getElementById('pickup-date').value;
      if(getOrderCountForDate(selectedDate) >= maxCapacityPerDay){
        alert('Sorry, this pickup slot filled up.');
        checkCapacityAlert(); return;
      }
      const newOrder = {
        id: Date.now(),
        date: selectedDate,
        item: currentCart.name,
        price: currentCart.price,
        customerName: document.getElementById('cust-name').value || '',
        phone: document.getElementById('cust-phone').value || '',
        email: document.getElementById('cust-email').value || ''
      };
      const all = JSON.parse(localStorage.getItem('orders') || '[]');
      all.push(newOrder);
      localStorage.setItem('orders', JSON.stringify(all));

      // show payment modal
      document.getElementById('modal-total-display').textContent = formatMoney(currentCart.price);
      const tag = localStorage.getItem('cashTag') || 'cashapp';
      const cashLink = document.getElementById('cashapp-link');
      cashLink.href = `https://cash.app/${encodeURIComponent(tag)}/${(currentCart.price||0).toFixed(2)}`;
      document.getElementById('payment-modal').style.display = 'flex';

      // reset cart
      currentCart = null;
      document.getElementById('cart-empty-message').style.display = '';
      document.getElementById('cart-form-content').classList.add('hidden');
      recalculateRollingCalendar();
    }

    function closeModal(){ document.getElementById('payment-modal').style.display = 'none'; }

    function renderCustomerManifest(targetDate){
      const wrapper = document.getElementById('manifest-table-wrapper');
      if(!targetDate){ wrapper.innerHTML = '<p>Select a date and click Show</p>'; return; }
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const matches = orders.filter(o => o.date === targetDate);
      if(matches.length === 0){ wrapper.innerHTML = `<p>No orders for ${targetDate}.</p>`; return; }
      let html = '<table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Item</th><th>Price</th></tr></thead><tbody>';
      matches.forEach(m=>{
        html += `<tr><td>${escapeHtml(m.customerName)}</td><td>${escapeHtml(m.phone)}</td><td>${escapeHtml(m.email)}</td><td>${escapeHtml(m.item)}</td><td>${formatMoney(m.price)}</td></tr>`;
      });
      html += '</tbody></table>';
      wrapper.innerHTML = html;
    }

    // Initialization
    window.onload = function(){
      if(!localStorage.getItem('storeName')) localStorage.setItem('storeName','BREAD STORE');
      if(!localStorage.getItem('cashTag')) localStorage.setItem('cashTag','YourCashTag');
      document.getElementById('store-title-display').textContent = localStorage.getItem('storeName');

      startLiveClock();
      recalculateRollingCalendar();

      document.getElementById('pickup-date').addEventListener('change', checkCapacityAlert);
      document.getElementById('order-form').addEventListener('submit', processOrder);
      document.getElementById('render-manifest-btn').addEventListener('click', ()=>{
        const d = document.getElementById('manifest-date-select').value; renderCustomerManifest(d);
      });
    };
  </script>
</body>
</html>
